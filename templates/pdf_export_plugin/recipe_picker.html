<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export Recipe to PDF</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #222;
    }
    h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
    }
    form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }
    input[type=text] {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
    }
    button {
        padding: 0.5rem 1.25rem;
        border: none;
        border-radius: 6px;
        background: #b5591a;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
    }
    button:hover {
        background: #94480f;
    }
    ul {
        list-style: none;
        padding: 0;
    }
    li {
        padding: 0.6rem 0;
        border-bottom: 1px solid #eee;
    }
    a {
        color: #b5591a;
        text-decoration: none;
        font-size: 1.05rem;
    }
    a:hover {
        text-decoration: underline;
    }
    p.hint {
        color: #777;
        font-size: 0.9rem;
    }
</style>
</head>
<body>
    <h1>Export Recipe to PDF</h1>
    <form method="get">
        <input type="text" name="q" value="{{ query }}" placeholder="Search recipes by name..." autofocus>
        <button type="submit">Search</button>
    </form>
    {% if query and not recipes %}
        <p class="hint">No matching recipes found.</p>
    {% endif %}
    <ul>
        {% for recipe in recipes %}
            <li><a href="{% url 'pdf_export_recipe' recipe.pk %}" target="_blank">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
